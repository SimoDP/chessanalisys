user:
  color: white            # white | black | both (both da M4)  (D-53)
  elo: 1900
  elo_scale: fide         # fide | lichess | chesscom (chesscom quando configurata)
  opp_elo: null           # null = uguale a elo
  elo_white: null         # solo color: both (M4)
  elo_black: null
  detail_level: 4         # M1-M3: solo 4 (D-30)
  language: it
input:
  method: null            # null = chiede | example | fen | pgn
  example_fen_file: examples/example.fen
  pgn_default_position: end
  max_attempts: 3
  confirm: true
engines:
  stockfish: {path: null, version_pin: "Stockfish 19", hash_mb: 4096, poll_s: 0.05, hash_max_ram_fraction: 0.25}
  maia2: {model_type: rapid, device: auto, version_pin: "0.11.0", up_delta: 300}
  syzygy: {path: null, max_pieces: 5}
  openings: {index_file: data/openings_index.json}
exploration:
  profile: standard       # fast | standard | deep
llm:
  provider: openrouter    # openrouter | anthropic (D-64, docs/DECISIONI_POST_CONGELAMENTO.md)
  model: deepseek/deepseek-v4.1-flash   # sviluppo (D-67); produzione da decidere. Con anthropic: claude-sonnet-5-5
  max_tokens: 16000
  temperature: 0.3
  max_retries: 2
  network_attempts: 3
  network_backoff_s: [2, 4, 8]
  on_fail: mark           # mark | drop
  critic: false           # da M4
  plan_max_moves: 6
  view: {multipv_lines: 5, pv_plies: 6, policy_moves: 5}   # vista ridotta (§6.1, D-65)
  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    timeout_s: 600
    cache_control_prefixes: ["anthropic/"]       # cache_control solo per questi modelli
    extra_body: {reasoning: {enabled: false}}    # niente ragionamento esteso (§9.1)
  anthropic: {timeout_s: 600}
  # M6: prezzi in dollari per milione di token, per modello, solo se il fornitore non dà il costo (OpenRouter lo
  # dà nella risposta). Vuoto: nel rapporto compaiono i token senza costo. Esempio:
  # prices: {"claude-sonnet-5-5": {input: …, cached_input: …, output: …}}
  prices: {}
render:
  mark_theory: footnote
output:
  dir: output
  slug_max_chars: 40      # §2-bis.5 (D-65)
