elo_input: {min: 400, max: 3000}
bands:                          # [lo, hi) su elo_ref_fide; chiavi SEMPRE tra virgolette
  "lt1200":    {lo: null, hi: 1200}
  "1200_1600": {lo: 1200, hi: 1600}
  "1600_2000": {lo: 1600, hi: 2000}
  "2000_2400": {lo: 2000, hi: 2400}
  "ge2400":    {lo: 2400, hi: null}
anchors:                        # [lo, hi) su elo_ref_fide
  "1500": {lo: null, hi: 1750}
  "1900": {lo: 1750, hi: 2150}
  "2400": {lo: 2150, hi: null}
band_params:
  "lt1200":    {plies_max: 3,  explained_min: 1, K: 2, listed_max: 3,  L_max: 40, prose_words: 450,  A: 0.6, B: 1.2}
  "1200_1600": {plies_max: 4,  explained_min: 2, K: 3, listed_max: 4,  L_max: 40, prose_words: 590,  A: 0.5, B: 1.0}   # M1b: 650 → 500 (fewshot 1500); M3: 560 (S02, S09), 590 (S02 più ampia)
  "1600_2000": {plies_max: 8,  explained_min: 3, K: 5, listed_max: 12, L_max: 35, prose_words: 1600, A: 0.3, B: 0.5}   # M3: 1400 → 1560 (S02, S09), 1600 (S02 più ampia)
  "2000_2400": {plies_max: 10, explained_min: 3, K: 4, listed_max: 12, L_max: 30, prose_words: 1100, A: 0.1, B: 0.2}
  "ge2400":    {plies_max: 12, explained_min: 4, K: 5, listed_max: 12, L_max: 25, prose_words: 790,  A: 0.0, B: 0.0}   # M1b: 800 → 610 (fewshot 2400); M3: 690 (S02, S09), 720 (S02 più ampia); M4: 790 (S11)
detail:                         # §7.2, da M4. k: explained_min | explained_min_plus_1 | band (K della fascia)
  # sections: required = solo le obbligatorie della matrice; required_s08 = + S08; applicable = tutte le
  # applicabili; all = tutte + S11 + esclusioni dell'ancora 2400 tolte. tables: tabelle ammesse (T4 è il
  # contenuto di S02 e resta con S02, OQ-M4-2); T2 segue anche tables.yaml (ancore).
  "1": {words: 0.35, plies_delta: -2, k: explained_min,        sections: required,     tables: [T1, T4]}
  "2": {words: 0.6,  plies_delta: -1, k: explained_min,        sections: required,     tables: [T1, T4]}
  "3": {words: 0.8,  plies_delta: 0,  k: explained_min_plus_1, sections: required_s08, tables: [T1, T3, T4]}
  "4": {words: 1.0,  plies_delta: 0,  k: band,                 sections: applicable,   tables: [T1, T2, T3, T4]}
  "5": {words: 1.4,  plies_delta: 2,  k: band,                 sections: all,          tables: [T1, T2, T3, T4], opp_t: true}
plies_bounds: [2, 12]           # §7.2: plies_max con il dettaglio, minimo 2, massimo 12
classification:
  natural_trap:     {p_user_min: 0.20, loss_min: 80, loss_min_low_bands: 60, low_bands: ["lt1200", "1200_1600"]}
  hard_move:        {p_user_max: 0.05, loss_max: 10}
  solid:            {p_user_min: 0.15, loss_max: 25}
  practical_alt:    {loss_gt: 25, max_loss: 60, complexity_max: 1}
  improbable_error: {p_user_max: 0.05, loss_min: 80, p_up_min: 0.08}
selection:
  quiet_spread_cp: 25
  forced_gap_cp: 100
  rec_tie_points: 5
  replies_min_p: 0.05
  replies_best_sf: 2
  context_spread_cp: 30
  context_candidates: 3
  context_min_p: 0.03         # D-68: candidate di contesto solo tra le mosse con p_opp medio >= 3%
profile:
  endgame_nonpawn_total_max: 24
  endgame_no_queens_max_minors_per_side: 2
  opening_fullmove_max: 15
  tactical: {gap_cp: 150, mate_plies: 8}
  closed_min_blocked_pairs: 3
  unresolved_capture_see_min: 3
elo_rules:
  e3_mandatory_from: 2150
  e3_min_detail: 4              # §7.1: sotto 2150 E3 è attiva solo con dettaglio >= 4 (M4)
  s11_from: 2000
theory_max_share: {"1500": 0.70, "1900": 0.50, "2400": 0.35}
# D-65: valori fissati nel testo della documentazione, spostati in configurazione
section_plan: {c3_loss_max_cp: 30, c5_pv_plies: 4, c5_pvs: 3}   # §8.2, condizioni c3 e c5
maia: {policy_min_p: 0.001}                      # §6.2, policy salvata nei nodi
features:                                        # §5.1, definizioni geometriche
  weak_square_files: "cdef"
  weak_square_ranks: [3, 5]                      # traverse relative del lato
  outpost_ranks: [4, 6]
  queenside_files: "abcd"
  kingside_files: "efgh"
  # M3 (§5.1): soglie delle feature «M3»
  inactive_mobility_max: 2                       # inactive_piece: mobilità <= 2
  bishop_open_min_moves: 7                       # bishop_diagonal_open: almeno 7 mosse pseudo-legali
  tempo_plies: 6                                 # tempo_count: prime 6 semimosse della PV migliore
  tempo_threat_see_min: 3                        # minaccia di cattura con SEE >= 3
  minority_pawn_files: "abc"                     # minority_attack: pedoni sulle colonne a-c
  minority_own_pawns: 2
  minority_opp_pawns: 3
  minority_piece_files: "bc"                     # torre o donna sulla colonna b o c
  space_min_diff: 3                              # space_advantage: differenza >= 3
  pawn_chain_min: 3                              # pawn_chain: almeno 3 pedoni
golden: {ac09_max_diff_cp: 25, ac09_top_n: 6}    # AC-09
# M3 (§5-bis): Category Scoring Engine. Ipotesi iniziali, da calibrare in M5 (§0.5, D-21); OQ-M3-1…
scoring:
  categories: [king_safety, pawn_structure, space_center, piece_activity, initiative_tempo,
               threats_dynamics, material, transition_plans, practical_complexity]
  lines:
    null_lines: 3                 # linee di E1 (mossa nulla) considerate come minacce
    root_threat_lines: 3          # avversario al tratto: sue prime linee alla radice considerate come minacce
    impact_min_cp: 50             # una linea entra nel calcolo se il danno è almeno 0,50
    impact_cap_cp: 1000           # tetto dell'impatto (anche per i matti)
    mate_cp: 1000                 # un matto vale questo nell'impatto
    att_plies: 6                  # P_att: mosse dell'attaccante nelle prime 6 semimosse della linea
    parry_share: 0.5              # mossa nulla: una mossa alla radice para se perde meno di metà dell'impatto
    quiescence_see_min: 1         # foglia dopo quiescenza: catture con SEE >= 1
    quiescence_max_plies: 4
  theta:                          # θ(Elo) in pedoni di danno atteso, per fascia (decrescente)
    "lt1200": 0.30
    "1200_1600": 0.25
    "1600_2000": 0.15
    "2000_2400": 0.10
    "ge2400": 0.05
  decisive_cp: 200                # perdita decisiva (banda decisive di §6.4): entra sempre
  visible_p_att_min: 0.10         # sotto questa P_att una linea che entra sempre è «invisibile»
  override: {p_att_min: 0.10, t_max: 29}     # §5-bis.4 punto 5: T <= 30; 29 perché sia «critico» (< 30)
  k: {king_safety: 0.075, pawn_structure: 0.12, space_center: 0.12, piece_activity: 0.12, initiative_tempo: 0.09,
      threats_dynamics: 0.075, material: 0.075, transition_plans: 0.12, practical_complexity: 1}   # M5: × 0.15 (docs/CALIBRATION_REPORT.md)
  w: {king_safety: 0.95, pawn_structure: 0.45, space_center: 0.45, piece_activity: 0.55, initiative_tempo: 0.75,
      threats_dynamics: 0.95, material: 0.85, transition_plans: 0.65, practical_complexity: 0}   # M5: +0.15 (docs/CALIBRATION_REPORT.md)
  tags:                           # confronto inizio linea / foglia (§5-bis.4 punto 1)
    material_min: 1
    center_shift_min: 3
    mobility_shift_min: 8
    tempo_min: 2
    leaf_plies: 6                 # foglia = dopo 6 semimosse della linea (poi quiescenza)
  # punti di penalità per T_stat (100 - somma); own = feature del lato, opp = dell'avversario;
  # relative: conta solo l'eccesso rispetto ai punti dell'avversario (categorie lente: nell'apertura entrambi
  # hanno pezzi da sviluppare e non è un motivo di preoccupazione)
  static:
    king_safety:
      own: {pawn_shield_weakened: 15, open_file_to_king: 10, castling_lost: 15, king_zone_attackers: 8, pin: 5}
      opp: {}
      per_value: [king_zone_attackers]          # moltiplicate per value
    pawn_structure:
      own: {isolated_pawn: 10, doubled_pawn: 8, backward_pawn: 10, weak_square: 4}
      opp: {passed_pawn: 12, outpost: 5}
      per_value: []
    space_center:
      relative: true
      own: {}
      opp: {space_advantage: 6}
      per_value: [space_advantage]
      center_points: 6                          # per attaccante in meno al centro
    piece_activity:
      relative: true
      own: {inactive_piece: 8}
      opp: {bishop_pair: 8, knight_outpost: 10, rook_seventh: 10, rook_open_file: 4, bishop_diagonal_open: 4}
      per_value: []
    initiative_tempo:
      relative: true
      own: {undeveloped_pieces: 6}
      opp: {development_lead: 10, tempo_count: 8}
      per_value: [development_lead, tempo_count]
    threats_dynamics:
      own: {hanging_piece: 25, fork: 30, skewer: 25, overloaded_piece: 15, pin: 10}
      opp: {check_available: 5, unresolved_capture: 20}
      per_value: []
    material:
      own: {}
      opp: {exchange_up: 15}
      per_value: []
      pawn_points: 12                           # per pedone di svantaggio materiale
    transition_plans:
      own: {}
      opp: {passed_pawn: 8, pawn_majority: 5}
      per_value: []
    practical_complexity: {own: {}, opp: {}, per_value: []}
  complexity:                     # practical_complexity (meta): entropia di Maia-2 e mosse uniche
    entropy_max_bits: 4.0
    unique_gap_cp: 100
    entropy_weight: 0.5
    unique_weight: 0.5
  relevance:                      # §5-bis.4 punto 6
    # proximity pesata da min(1, risk / θ); decision = quota delle linee principali (PV delle candidate spiegate
    # o delle risposte) con il tag della categoria
    weights: {worry: 0.4, balance: 0.15, proximity: 0.2, decision: 0.25}
    proximity_plies: 8
    phase:
      opening:    {king_safety: 0.9, pawn_structure: 0.8, space_center: 1.0, piece_activity: 1.0, initiative_tempo: 1.0,
                   threats_dynamics: 1.0, material: 1.0, transition_plans: 0.4, practical_complexity: 0.8}
      middlegame: {king_safety: 1.0, pawn_structure: 0.9, space_center: 0.8, piece_activity: 1.0, initiative_tempo: 0.9,
                   threats_dynamics: 1.0, material: 1.0, transition_plans: 0.7, practical_complexity: 0.8}
      endgame:    {king_safety: 0.5, pawn_structure: 1.0, space_center: 0.4, piece_activity: 1.0, initiative_tempo: 0.6,
                   threats_dynamics: 1.0, material: 1.0, transition_plans: 1.0, practical_complexity: 0.8}
  advice:                         # bande di T dell'utente (§5-bis.2), limite inferiore incluso
    no_worry: 85
    monitor: 60
    attention: 30
keypoints:                      # scaletta dei punti chiave (fase B, plan/keypoints.py): selezione e ordine
  order:                        # ordine dei tipi, per chi muove alla radice
    user_to_move: [verdict, recommendation, main_danger, likely_reply, opportunity, systems, plan, reasoning]
    opp_to_move: [verdict, main_danger, likely_reply, opportunity, plan, reasoning]
  max_points: {"1": 3, "2": 4, "3": 5, "4": 6, "5": 8}   # punti per livello di dettaglio (il verdetto conta)
  max_replies: {"1": 1, "2": 2, "3": 2, "4": 3, "5": 3}  # risposte dell'avversario in likely_reply
  positional_min_cp: 100        # verdetto: vantaggio «posizionale» se il materiale è pari e |valutazione| >= 1,00
  only_move_gap_cp: 150         # mossa unica: la seconda perde almeno 1,50
  danger_min_cp: 150            # main_danger: danno rispetto alla media di Maia-2 (o impatto della linea L)
  likely_min_p: 0.10            # likely_reply: risposte dell'avversario almeno al 10%
  trap_p_min: 0.20              # trappola naturale: risposta dell'utente almeno al 20% …
  trap_loss_min_cp: 80          # … che perde almeno 0,80
  answer_loss_max_cp: 30        # risposte giuste: entro 0,30 dalla migliore
  opportunity_gain_cp: 100      # opportunity: mossa probabile dell'avversario che regala almeno 1,00 …
  opportunity_min_p: 0.05       # … giocata almeno nel 5% dei casi
  systems_loss_max_cp: 30       # systems: candidate spiegate entro 0,30 dalla migliore …
  systems_min_moves: 3          # … almeno tre (posizione con più piani equivalenti)
  plan_max_facts: 7
  # feature del piano, in ordine di priorità: (chiave, di chi deve essere la feature: user | opp); prima ancora i
  # pezzi attaccati più volte di quante sono difesi (dell'utente da difendere, dell'avversario come bersagli)
  plan_features:
    - [isolated_pawn, opp]
    - [backward_pawn, opp]
    - [doubled_pawn, opp]
    - [passed_pawn, user]
    - [passed_pawn, opp]
    - [check_available, opp]
    - [knight_outpost, user]
    - [outpost, user]
    - [rook_open_file, user]
    - [rook_seventh, user]
    - [bishop_diagonal_open, user]
    - [bishop_pair, user]
    - [bishop_pair, opp]
    - [inactive_piece, opp]
    - [inactive_piece, user]
    - [pawn_majority, user]
    - [open_file_to_king, opp]
    - [pawn_shield_weakened, opp]
    - [open_file_to_king, user]
  island_diff_min: 1            # isole di pedoni: fatto del piano se l'avversario ne ha almeno una in più
  forced_p: 0.90               # risposta quasi forzata alla mossa consigliata: raccontata con la mossa
  space_rank: 3                 # traversa (da 0, dal proprio lato) da cui un pedone guadagna spazio
  break_files: cdef             # rotture di pedoni: solo contro i pedoni di queste colonne
  easy_min_p: 0.80             # verdetto: «facile» se Maia-2 dà almeno questo alle mosse che non perdono
  king_attack_min: 3            # casa vicino al re difesa solo dal re: fatto se tanti pezzi nemici la colpiscono
  secondary_bands: [clear_minus, decisive_minus, mate_minus]   # con queste bande i punti forti dell'utente sono secondari
  user_assets: [knight_outpost, outpost, rook_open_file, rook_seventh, bishop_diagonal_open, bishop_pair,
                pawn_majority, passed_pawn, bishop_long_diagonal]
  # D-72: documento con una sezione per punto chiave. Sezione del documento di ogni tipo (gli ID S01…S13
  # restano quelli dello schema di uscita); parole = base + per_item × elementi del punto + per_move × mosse
  # citate, tra words_min e words_max (da due a cinque frasi per elemento)
  sections: {verdict: S01, recommendation: S03, systems: S04, plan: S05, main_danger: S06, likely_reply: S07,
             opportunity: S08, reasoning: S10}
  words:
    verdict: {base: 45, per_item: 0}
    recommendation: {base: 30, per_item: 0, per_move: 15}
    systems: {base: 15, per_item: 12}
    plan: {base: 10, per_item: 15}
    main_danger: {base: 65, per_item: 0}
    likely_reply: {base: 10, per_item: 0, per_move: 22}
    opportunity: {base: 10, per_item: 0, per_move: 22}
    reasoning: {base: 10, per_item: 16}
  words_min: 30
  words_max: 220
  pv_plies: 4                   # semimosse al massimo di una variante citata nel testo (il resto è nelle tabelle)
  reasoning_items: {"1": 3, "2": 3, "3": 4, "4": 4, "5": 5}   # «Come ragionare»: punti dell'elenco
